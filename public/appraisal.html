    <body>
    	<div id="column">
       	    <div class="section" id="miniheader">
                <div id="backgrounds">
                    <img src="img/home1.jpg"/>
		        </div>
                <div id="row1">
                    <img id="logo" src="img/logo.png"/>
                    <h1>Becker Appraisal Service, Inc.</h1>
                </div>
                <div id="row2">
                    <a href="index.html">Home</a>
                    <a href="about.html">About Us</a>
                    <a href="services.html">Services</a>
                    <a href="appraisal.html">Appraisal Request</a>
                    <a href="contact.html">Contact Us</a>
                </div>
            </div>
            <div class="section">
                <div id="subpage-body">
                    <form action="https://formspree.io/f/xlgoyrre" method="POST">
                        <label>
                            Email: 
                            <input type="email" name="email">
                        </label>
                        <label>
                            First Name: 
                            <input type="text" name="firstname">
                        </label>
                        <label>
                            Last Name: 
                            <input type="text" name="lastname">
                        </label>
                        <label>
                            Street Address of Subject Property, Address Line 1: 
                            <input type="text" name="addr1">
                        </label>
                        <label>
                            Street Address of Subject Property, Address Line 2: 
                            <input type="text" name="addr2">
                        </label>
                        <label>
                            Zip Code of Subject Property (5 digits): 
                            <input type="number" name="zip">
                        </label>
                        <label>
                            State Mailing Abbrv of Subject Property (2 letters): 
                            <input type="text" name="state">
                        </label>
                        <label>
                            Daytime Phone: 
                            <input type="number" name="phoneday">
                        </label>
                        <label>
                            Evening Phone: 
                            <input type="text" name="phoneeve">
                        </label>
                        <label>
                            Specify fee: 
                            <input type="text" name="fee">
                        </label>
                        <label>
                            Comments: 
                            <input type="textarea" name="comments">
                        </label>
                        
                    </form>
                </div>
            </div>
            <div class="section" id="foot"></div>
        </div>
